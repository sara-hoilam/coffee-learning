<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>SonneCAD</title>
<style>/* required styles */

.leaflet-pane,
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-tile-container,
.leaflet-pane > svg,
.leaflet-pane > canvas,
.leaflet-zoom-box,
.leaflet-image-layer,
.leaflet-layer {
	position: absolute;
	left: 0;
	top: 0;
	}
.leaflet-container {
	overflow: hidden;
	}
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow {
	-webkit-user-select: none;
	   -moz-user-select: none;
	        user-select: none;
	  -webkit-user-drag: none;
	}
/* Prevents IE11 from highlighting tiles in blue */
.leaflet-tile::selection {
	background: transparent;
}
/* Safari renders non-retina tile on retina better with this, but Chrome is worse */
.leaflet-safari .leaflet-tile {
	image-rendering: -webkit-optimize-contrast;
	}

.leaflet-safari .leaflet-tile-container {
	width: 1600px;
	height: 1600px;
	-webkit-transform-origin: 0 0;
	}
.leaflet-marker-icon,
.leaflet-marker-shadow {
	display: block;
	}

/* .leaflet-container img: map is broken in FF if you have max-width: 100% on tiles */
.leaflet-container .leaflet-overlay-pane svg {
	max-width: none !important;
	max-height: none !important;
	}
.leaflet-container .leaflet-marker-pane img,
.leaflet-container .leaflet-shadow-pane img,
.leaflet-container .leaflet-tile-pane img,
.leaflet-container img.leaflet-image-layer,
.leaflet-container .leaflet-tile {
	max-width: none !important;
	max-height: none !important;
	width: auto;
	padding: 0;
	}

.leaflet-container img.leaflet-tile {
	/* See: https://bugs.chromium.org/p/chromium/issues/detail?id=600120 */
	mix-blend-mode: plus-lighter;
}

.leaflet-container.leaflet-touch-zoom {
	-ms-touch-action: pan-x pan-y;
	touch-action: pan-x pan-y;
	}
.leaflet-container.leaflet-touch-drag {
	-ms-touch-action: pinch-zoom;
	/* Fallback for FF which doesn't support pinch-zoom */
	touch-action: none;
	touch-action: pinch-zoom;
}
.leaflet-container.leaflet-touch-drag.leaflet-touch-zoom {
	-ms-touch-action: none;
	touch-action: none;
}
.leaflet-container {
	-webkit-tap-highlight-color: transparent;
}
.leaflet-container a {
	-webkit-tap-highlight-color: rgba(51, 181, 229, 0.4);
}
.leaflet-tile {
	filter: inherit;
	visibility: hidden;
	}
.leaflet-tile-loaded {
	visibility: inherit;
	}
.leaflet-zoom-box {
	width: 0;
	height: 0;
	-moz-box-sizing: border-box;
	     box-sizing: border-box;
	z-index: 800;
	}
/* workaround for https://bugzilla.mozilla.org/show_bug.cgi?id=888319 */
.leaflet-overlay-pane svg {
	-moz-user-select: none;
	}

.leaflet-pane         { z-index: 400; }

.leaflet-tile-pane    { z-index: 200; }
.leaflet-overlay-pane { z-index: 400; }
.leaflet-shadow-pane  { z-index: 500; }
.leaflet-marker-pane  { z-index: 600; }
.leaflet-tooltip-pane   { z-index: 650; }
.leaflet-popup-pane   { z-index: 700; }

.leaflet-map-pane canvas { z-index: 100; }
.leaflet-map-pane svg    { z-index: 200; }

.leaflet-vml-shape {
	width: 1px;
	height: 1px;
	}
.lvml {
	behavior: url(#default#VML);
	display: inline-block;
	position: absolute;
	}


/* control positioning */

.leaflet-control {
	position: relative;
	z-index: 800;
	pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */
	pointer-events: auto;
	}
.leaflet-top,
.leaflet-bottom {
	position: absolute;
	z-index: 1000;
	pointer-events: none;
	}
.leaflet-top {
	top: 0;
	}
.leaflet-right {
	right: 0;
	}
.leaflet-bottom {
	bottom: 0;
	}
.leaflet-left {
	left: 0;
	}
.leaflet-control {
	float: left;
	clear: both;
	}
.leaflet-right .leaflet-control {
	float: right;
	}
.leaflet-top .leaflet-control {
	margin-top: 10px;
	}
.leaflet-bottom .leaflet-control {
	margin-bottom: 10px;
	}
.leaflet-left .leaflet-control {
	margin-left: 10px;
	}
.leaflet-right .leaflet-control {
	margin-right: 10px;
	}


/* zoom and fade animations */

.leaflet-fade-anim .leaflet-popup {
	opacity: 0;
	-webkit-transition: opacity 0.2s linear;
	   -moz-transition: opacity 0.2s linear;
	        transition: opacity 0.2s linear;
	}
.leaflet-fade-anim .leaflet-map-pane .leaflet-popup {
	opacity: 1;
	}
.leaflet-zoom-animated {
	-webkit-transform-origin: 0 0;
	    -ms-transform-origin: 0 0;
	        transform-origin: 0 0;
	}
svg.leaflet-zoom-animated {
	will-change: transform;
}

.leaflet-zoom-anim .leaflet-zoom-animated {
	-webkit-transition: -webkit-transform 0.25s cubic-bezier(0,0,0.25,1);
	   -moz-transition:    -moz-transform 0.25s cubic-bezier(0,0,0.25,1);
	        transition:         transform 0.25s cubic-bezier(0,0,0.25,1);
	}
.leaflet-zoom-anim .leaflet-tile,
.leaflet-pan-anim .leaflet-tile {
	-webkit-transition: none;
	   -moz-transition: none;
	        transition: none;
	}

.leaflet-zoom-anim .leaflet-zoom-hide {
	visibility: hidden;
	}


/* cursors */

.leaflet-interactive {
	cursor: pointer;
	}
.leaflet-grab {
	cursor: -webkit-grab;
	cursor:    -moz-grab;
	cursor:         grab;
	}
.leaflet-crosshair,
.leaflet-crosshair .leaflet-interactive {
	cursor: crosshair;
	}
.leaflet-popup-pane,
.leaflet-control {
	cursor: auto;
	}
.leaflet-dragging .leaflet-grab,
.leaflet-dragging .leaflet-grab .leaflet-interactive,
.leaflet-dragging .leaflet-marker-draggable {
	cursor: move;
	cursor: -webkit-grabbing;
	cursor:    -moz-grabbing;
	cursor:         grabbing;
	}

/* marker & overlays interactivity */
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-image-layer,
.leaflet-pane > svg path,
.leaflet-tile-container {
	pointer-events: none;
	}

.leaflet-marker-icon.leaflet-interactive,
.leaflet-image-layer.leaflet-interactive,
.leaflet-pane > svg path.leaflet-interactive,
svg.leaflet-image-layer.leaflet-interactive path {
	pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */
	pointer-events: auto;
	}

/* visual tweaks */

.leaflet-container {
	background: #ddd;
	outline-offset: 1px;
	}
.leaflet-container a {
	color: #0078A8;
	}
.leaflet-zoom-box {
	border: 2px dotted #38f;
	background: rgba(255,255,255,0.5);
	}


/* general typography */
.leaflet-container {
	font-family: "Helvetica Neue", Arial, Helvetica, sans-serif;
	font-size: 12px;
	font-size: 0.75rem;
	line-height: 1.5;
	}


/* general toolbar styles */

.leaflet-bar {
	border-radius: 4px;
	}
.leaflet-bar a {
	background-color: #fff;
	border-bottom: 1px solid #ccc;
	width: 26px;
	height: 26px;
	line-height: 26px;
	display: block;
	text-align: center;
	text-decoration: none;
	color: black;
	}
.leaflet-bar a,
.leaflet-control-layers-toggle {
	background-position: 50% 50%;
	background-repeat: no-repeat;
	display: block;
	}
.leaflet-bar a:hover,
.leaflet-bar a:focus {
	background-color: #f4f4f4;
	}
.leaflet-bar a:first-child {
	border-top-left-radius: 4px;
	border-top-right-radius: 4px;
	}
.leaflet-bar a:last-child {
	border-bottom-left-radius: 4px;
	border-bottom-right-radius: 4px;
	border-bottom: none;
	}
.leaflet-bar a.leaflet-disabled {
	cursor: default;
	background-color: #f4f4f4;
	color: #bbb;
	}

.leaflet-touch .leaflet-bar a {
	width: 30px;
	height: 30px;
	line-height: 30px;
	}
.leaflet-touch .leaflet-bar a:first-child {
	border-top-left-radius: 2px;
	border-top-right-radius: 2px;
	}
.leaflet-touch .leaflet-bar a:last-child {
	border-bottom-left-radius: 2px;
	border-bottom-right-radius: 2px;
	}

/* zoom control */

.leaflet-control-zoom-in,
.leaflet-control-zoom-out {
	font: bold 18px 'Lucida Console', Monaco, monospace;
	text-indent: 1px;
	}

.leaflet-touch .leaflet-control-zoom-in, .leaflet-touch .leaflet-control-zoom-out  {
	font-size: 22px;
	}


/* layers control */

.leaflet-control-layers {
	background: #fff;
	border-radius: 5px;
	}
.leaflet-control-layers-toggle {
	background-image: url(images/layers.png);
	width: 36px;
	height: 36px;
	}
.leaflet-retina .leaflet-control-layers-toggle {
	background-image: url(images/layers-2x.png);
	background-size: 26px 26px;
	}
.leaflet-touch .leaflet-control-layers-toggle {
	width: 44px;
	height: 44px;
	}
.leaflet-control-layers .leaflet-control-layers-list,
.leaflet-control-layers-expanded .leaflet-control-layers-toggle {
	display: none;
	}
.leaflet-control-layers-expanded .leaflet-control-layers-list {
	display: block;
	position: relative;
	}
.leaflet-control-layers-expanded {
	padding: 6px 10px 6px 6px;

	background: #fff;
	}
.leaflet-control-layers-scrollbar {
	overflow-y: scroll;
	overflow-x: hidden;
	padding-right: 5px;
	}
.leaflet-control-layers-selector {
	margin-top: 2px;
	position: relative;
	top: 1px;
	}
.leaflet-control-layers label {
	display: block;
	font-size: 13px;
	font-size: 1.08333em;
	}
.leaflet-control-layers-separator {
	height: 0;
	border-top: 1px solid #ddd;
	margin: 5px -10px 5px -6px;
	}

/* Default icon URLs */
.leaflet-default-icon-path { /* used only in path-guessing heuristic, see L.Icon.Default */
	background-image: url(images/marker-icon.png);
	}


/* attribution and scale controls */

.leaflet-container .leaflet-control-attribution {
	background: #fff;
	background: rgba(255, 255, 255, 0.8);

	}
.leaflet-control-attribution,
.leaflet-control-scale-line {
	padding: 0 5px;

.leaflet-attribution-flag {

	width: 1em;
	height: 0.6669em;
	}
.leaflet-left .leaflet-control-scale {
	margin-left: 5px;
	}
.leaflet-bottom .leaflet-control-scale {
	margin-bottom: 5px;
	}
.leaflet-control-scale-line {
	border: 2px solid #777;
	border-top: none;
	line-height: 1.1;
	padding: 2px 5px 1px;
	white-space: nowrap;
	-moz-box-sizing: border-box;
	     box-sizing: border-box;
	background: rgba(255, 255, 255, 0.8);
	text-shadow: 1px 1px #fff;
	}
.leaflet-control-scale-line:not(:first-child) {
	border-top: 2px solid #777;
	border-bottom: none;
	margin-top: -2px;
	}
.leaflet-control-scale-line:not(:first-child):not(:last-child) {
	border-bottom: 2px solid #777;
	}

.leaflet-touch .leaflet-control-attribution,
.leaflet-touch .leaflet-control-layers,
.leaflet-touch .leaflet-bar {
	}
.leaflet-touch .leaflet-control-layers,
.leaflet-touch .leaflet-bar {
	border: 2px solid rgba(0,0,0,0.2);
	background-clip: padding-box;
	}


/* popup */

.leaflet-popup {
	position: absolute;
	text-align: center;
	margin-bottom: 20px;
	}
.leaflet-popup-content-wrapper {
	padding: 1px;
	text-align: left;
	border-radius: 12px;
	}
.leaflet-popup-content {
	margin: 13px 24px 13px 20px;
	line-height: 1.3;
	font-size: 13px;
	font-size: 1.08333em;
	min-height: 1px;
	}
.leaflet-popup-content p {
	margin: 17px 0;
	margin: 1.3em 0;
	}
.leaflet-popup-tip-container {
	width: 40px;
	height: 20px;
	position: absolute;
	left: 50%;
	margin-top: -1px;
	margin-left: -20px;
	overflow: hidden;
	pointer-events: none;
	}
.leaflet-popup-tip {
	width: 17px;
	height: 17px;
	padding: 1px;

	margin: -10px auto 0;
	pointer-events: auto;

	-webkit-transform: rotate(45deg);
	   -moz-transform: rotate(45deg);
	    -ms-transform: rotate(45deg);
	        transform: rotate(45deg);
	}
.leaflet-popup-content-wrapper,
.leaflet-popup-tip {
	background: white;
	color: #333;
	}
.leaflet-container a.leaflet-popup-close-button {
	position: absolute;
	top: 0;
	right: 0;
	border: none;
	text-align: center;
	width: 24px;
	height: 24px;
	font: 16px/24px Tahoma, Verdana, sans-serif;
	color: #757575;
	text-decoration: none;
	background: transparent;
	}
.leaflet-container a.leaflet-popup-close-button:hover,
.leaflet-container a.leaflet-popup-close-button:focus {
	color: #585858;
	}
.leaflet-popup-scrolled {
	overflow: auto;
	}

.leaflet-oldie .leaflet-popup-content-wrapper {
	-ms-zoom: 1;
	}
.leaflet-oldie .leaflet-popup-tip {
	width: 24px;
	margin: 0 auto;

	-ms-filter: "progid:DXImageTransform.Microsoft.Matrix(M11=0.70710678, M12=0.70710678, M21=-0.70710678, M22=0.70710678)";
	filter: progid:DXImageTransform.Microsoft.Matrix(M11=0.70710678, M12=0.70710678, M21=-0.70710678, M22=0.70710678);
	}

.leaflet-oldie .leaflet-control-zoom,
.leaflet-oldie .leaflet-control-layers,
.leaflet-oldie .leaflet-popup-content-wrapper,
.leaflet-oldie .leaflet-popup-tip {
	border: 1px solid #999;
	}


/* div icon */

.leaflet-div-icon {
	background: #fff;
	border: 1px solid #666;
	}


/* Tooltip */
/* Base styles for the element that has a tooltip */
.leaflet-tooltip {
	position: absolute;
	padding: 6px;
	background-color: #fff;
	border: 1px solid #fff;
	border-radius: 3px;
	color: #222;
	white-space: nowrap;
	-webkit-user-select: none;
	-moz-user-select: none;
	-ms-user-select: none;
	user-select: none;
	pointer-events: none;
	}
.leaflet-tooltip.leaflet-interactive {
	cursor: pointer;
	pointer-events: auto;
	}
.leaflet-tooltip-top:before,
.leaflet-tooltip-bottom:before,
.leaflet-tooltip-left:before,
.leaflet-tooltip-right:before {
	position: absolute;
	pointer-events: none;
	border: 6px solid transparent;
	background: transparent;
	content: "";
	}

/* Directions */

.leaflet-tooltip-bottom {
	margin-top: 6px;
}
.leaflet-tooltip-top {
	margin-top: -6px;
}
.leaflet-tooltip-bottom:before,
.leaflet-tooltip-top:before {
	left: 50%;
	margin-left: -6px;
	}
.leaflet-tooltip-top:before {
	bottom: 0;
	margin-bottom: -12px;
	border-top-color: #fff;
	}
.leaflet-tooltip-bottom:before {
	top: 0;
	margin-top: -12px;
	margin-left: -6px;
	border-bottom-color: #fff;
	}
.leaflet-tooltip-left {
	margin-left: -6px;
}
.leaflet-tooltip-right {
	margin-left: 6px;
}
.leaflet-tooltip-left:before,
.leaflet-tooltip-right:before {
	top: 50%;
	margin-top: -6px;
	}
.leaflet-tooltip-left:before {
	right: 0;
	margin-right: -12px;
	border-left-color: #fff;
	}
.leaflet-tooltip-right:before {
	left: 0;
	margin-left: -12px;
	border-right-color: #fff;
	}

/* Printing */

@media print {
	/* Prevent printers from removing background-images of controls. */
	.leaflet-control {
		-webkit-print-color-adjust: exact;
		print-color-adjust: exact;
		}
	}

:root{
  /* Base */
  --paper:#F4EFE8;--paper-2:#FBF8F3;--ink:#201E1F;--ink-2:#6B6460;--rule:#E2D9CC;
  /* Block colours */
  --c-origin:#B98535;--c-bean:#1C3D24;--c-process:#FC4109;--c-grading:#5D9DC5;--c-pink:#FFABC8;--c-lilac:#E7BFFF;
  /* Text on blocks */
  --on-forest:#F4EFE8;--on-orange:#201E1F;--on-blue:#201E1F;--on-ochre:#201E1F;--on-pink:#201E1F;
  /* Shape and space */
  --r-block:0px;--r-pill:999px;--r-media:12px;
  --s-1:8px;--s-2:16px;--s-3:24px;--s-4:40px;--s-5:64px;--s-6:96px;
  --gutter:40px;--maxw:1280px;--hd:88px;
}
*{box-sizing:border-box}
html{scroll-padding-top:calc(var(--hd) + 16px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Bricolage Grotesque",-apple-system,"Segoe UI","PingFang HK","Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
a{color:var(--ink);text-decoration:underline;text-underline-offset:2px;text-decoration-thickness:1px}
a:hover{text-decoration-thickness:2px}
:focus-visible{outline:2.5px solid var(--ink);outline-offset:3px}
button{font:inherit;color:inherit}
img{max-width:100%}
.wrap{max-width:calc(var(--maxw) + 2*var(--gutter));margin:0 auto;padding:0 var(--gutter)}

/* Type scale */
.display{margin:0;font-size:clamp(40px,5vw,64px);line-height:1;font-weight:700;letter-spacing:-.02em}
.lede{margin:var(--s-2) 0 0;font-size:clamp(20px,2vw,26px);line-height:1.3;font-weight:300;max-width:42ch}
.lbl,.ct{margin:0;font-size:13px;line-height:1.2;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);font-style:normal}
.small,.foot{font-size:14px;line-height:1.45;color:var(--ink-2)}
.foot{margin-top:var(--s-1)}
.rule-sec{border-top:1.5px solid var(--ink);padding-top:var(--s-2)}
.bar{width:64px;height:8px;background:var(--c,var(--ink));margin-bottom:var(--s-3)}

/* Header */
.top{position:sticky;top:0;z-index:1000;background:var(--paper);border-bottom:1px solid transparent;transition:border-color .2s}
.top.scrolled{border-bottom-color:var(--rule)}
.hd{display:flex;align-items:center;gap:var(--s-2) var(--s-4);min-height:var(--hd);flex-wrap:wrap;padding-top:12px;padding-bottom:12px}
.brand{display:flex;align-items:center;gap:14px;flex:1 1 auto;min-width:0}
.logo{width:44px;height:44px;border-radius:50%;background:var(--ink);display:grid;place-items:center;flex:none}
.brand h1{margin:0;font-size:20px;line-height:1.2;font-weight:700;letter-spacing:-.01em}
.brand .sub{font-size:14px;line-height:1.3;color:var(--ink-2)}
.tabs{display:flex;gap:10px;padding:4px 2px}
.tabs button{height:48px;padding:0 20px;border-radius:var(--r-pill);border:1.5px solid var(--ink);background:transparent;font-size:16px;font-weight:700;line-height:1;white-space:nowrap;cursor:pointer;transition:transform .2s,background-color .2s}
.tabs button:hover{background:var(--paper-2)}
.tabs button.on{transform:rotate(-2deg)}
#tb_beans.on{background:var(--c-origin);border-color:var(--c-origin);color:var(--on-ochre)}
#tb_beantype.on{background:var(--c-bean);border-color:var(--c-bean);color:var(--on-forest)}
#tb_process.on{background:var(--c-process);border-color:var(--c-process);color:var(--on-orange)}
#tb_grading.on{background:var(--c-grading);border-color:var(--c-grading);color:var(--on-blue)}
.lang{display:flex;gap:6px}
.lang button{height:36px;min-width:52px;padding:0 14px;border-radius:var(--r-pill);border:1.5px solid var(--ink);background:transparent;font-size:15px;font-weight:700;cursor:pointer}
.lang button.on{background:var(--ink);color:var(--paper)}
@media (prefers-reduced-motion:reduce){.tabs button,.top{transition:none}.tabs button.on{transform:none}}

/* Tab intro strip */
.tabp[hidden]{display:none!important}
.intro{display:flex;flex-wrap:wrap;align-items:flex-end;gap:var(--s-4) var(--s-5);padding-top:var(--s-5);padding-bottom:var(--s-4)}
.intro-txt{flex:1 1 520px;min-width:0}
.intro-side{flex:0 1 460px;min-width:0}
.hero{margin:0;flex:1 1 440px;min-width:0}
.hero img,.photo img{width:100%;height:auto;aspect-ratio:4/3;object-fit:cover;border-radius:var(--r-media);display:block;background:var(--rule);filter:saturate(.92) contrast(1.03)}
.hero figcaption,.photo figcaption,.cred,.pmcred{margin-top:var(--s-1);font-size:14px;line-height:1.4;color:var(--ink-2)}
.photo{margin:0}
figure:empty{display:none}
.cupsec:has(#cupPhoto:empty){grid-template-columns:minmax(0,1fr)}

/* Pills used inside content */
.tag{display:inline-flex;align-items:center;vertical-align:middle;margin-left:6px;padding:2px 9px;border-radius:var(--r-pill);font-size:12px;font-weight:600;line-height:1.4;letter-spacing:0;text-transform:none;font-style:normal;white-space:nowrap}
.tag.c,.tag.s2{background:var(--c-lilac);color:var(--ink)}
.tag.r{border:1.2px solid var(--ink);color:var(--ink);padding:1px 8px}
.pill{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 18px;border-radius:var(--r-pill);border:1.5px solid var(--ink);background:transparent;font-size:15px;font-weight:700;cursor:pointer;white-space:nowrap}
.pill:hover{background:var(--paper-2)}
.pill.on,.pill[aria-pressed="true"]{background:var(--c-bean);border-color:var(--c-bean);color:var(--on-forest)}
.pill i{width:12px;height:12px;border-radius:50%;flex:none;outline:1.5px solid var(--paper-2)}

/* ---------- Beans Origin ---------- */
.legend{display:flex;flex-wrap:wrap;gap:10px 20px}
.legend .lg{display:inline-flex;align-items:center;gap:8px;font-size:14px;line-height:1.3}
.legend .lg.note{color:var(--ink-2)}
.legend .lg i{width:14px;height:14px;border-radius:50%;flex:none;border:2px solid var(--paper-2);outline:1px solid rgba(32,30,31,.45)}
#mapwrap{position:relative;height:520px;border-radius:var(--r-media);overflow:hidden;background:#E7E1D7}
#map{position:absolute;inset:0;background:#E7E1D7}
.mt{position:absolute;z-index:500;top:16px;right:16px;max-width:calc(100% - 96px);background:var(--paper-2);padding:6px 14px;border-radius:var(--r-pill);font-size:13px;line-height:1.35}
.hint{margin:12px 0 0}
.origin-grid{display:grid;grid-template-columns:minmax(0,8fr) minmax(0,4fr);gap:var(--s-4);align-items:start;margin-top:var(--s-5)}
.dhead{padding:28px 32px;background:var(--paper-2)}
.dhead.blk{background:var(--rc);color:var(--rf)}
.dhead.blk .lbl{color:inherit}
.dhead h2,#dName{margin:12px 0 6px;font-size:28px;line-height:1.1;font-weight:700;letter-spacing:-.01em}
.dhead.blk #dName{font-size:clamp(32px,4vw,48px);line-height:1;letter-spacing:-.02em}
#dTag{font-size:18px;line-height:1.35}
.dbody{padding-top:var(--s-3)}
.flvwrap{margin-bottom:var(--s-3)}
.flvwrap:has(#dFlavor:empty){display:none}
#dFlavor{display:block;margin:10px 0 0;font-size:clamp(20px,2vw,26px);line-height:1.3;font-weight:300}
#dFacts{border-top:1.5px solid var(--ink)}
#dFacts:empty{display:none}
.fact{display:grid;grid-template-columns:180px minmax(0,1fr);gap:var(--s-3);padding:12px 0;border-bottom:1px solid var(--rule);font-size:16px;line-height:1.5}
.fact>span:first-child{color:var(--ink-2)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;min-height:36px;padding:4px 14px;border-radius:var(--r-pill);border:1.5px solid var(--ink);background:transparent;font-size:14px;font-weight:600;cursor:pointer}
.chip:hover{background:var(--paper-2)}
.fun{margin-top:var(--s-3);font-size:16px;line-height:1.5}
.fun b{font-weight:700}
#dCls{margin-top:var(--s-4)}
#dCls .lbl{margin-bottom:8px}
.note{font-size:16px;line-height:1.55}
#dNotes{margin-top:12px}
.tip{display:flex;gap:14px;align-items:flex-start;margin-top:var(--s-3);background:var(--c-pink);color:var(--on-pink);padding:18px 22px;font-size:16px;line-height:1.5}
.tip svg{flex:none;margin-top:2px}
.origins{position:sticky;top:calc(var(--hd) + 8px);max-height:calc(100vh - var(--hd) - 32px);display:flex;flex-direction:column;border-top:1.5px solid var(--ink);padding-top:var(--s-2)}
#oq{flex:none;width:100%;height:48px;margin:14px 0 16px;padding:0 20px;border-radius:var(--r-pill);border:1.5px solid var(--ink);background:var(--paper-2);font:inherit;font-size:16px;color:var(--ink)}
#oq::placeholder{color:var(--ink-2);opacity:1}
#regions{flex:1 1 auto;min-height:200px;overflow-y:auto;padding-right:6px;overscroll-behavior:contain}
.grph{display:flex;align-items:center;gap:8px;margin:20px 0 8px;font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.grph:first-child{margin-top:4px}
.grph em{font-style:normal;color:var(--ink-2);font-weight:400}
.grph .dot{width:12px;height:12px;border-radius:50%;flex:none}
.item{display:block;padding:12px 14px;cursor:pointer;border-radius:0}
.item:hover{background:var(--paper-2)}
.item .dot{display:none}
.item b{display:block;font-size:16px;line-height:1.3;font-weight:700}
.item small{display:block;margin-top:2px;font-size:14px;line-height:1.4;color:var(--ink-2)}
.item.sel{background:var(--rc);color:var(--rf)}
.item.sel small{color:inherit}
#regions .item.subi{margin-left:14px;padding:6px 0 6px 16px;border-left:1px solid var(--rule)}
#regions .item.subi b{font-size:14px;font-weight:500}
#regions .item.subi.sel{padding-left:16px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s-4) var(--s-5);margin-top:var(--s-6)}
.two ul,.rule-sec ul{margin:var(--s-3) 0 0;padding-left:20px;font-size:16px;line-height:1.55}
.two li,.rule-sec li{margin-bottom:10px}
.srcwrap{margin-top:var(--s-5)}
.srcwrap summary{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:48px;cursor:pointer;list-style:none}
.srcwrap summary::-webkit-details-marker{display:none}
.srcwrap summary .chev{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;border:1.5px solid var(--ink);transition:transform .2s}
.srcwrap details[open] .chev{transform:rotate(180deg)}
.src{columns:2 320px;column-gap:var(--s-5)}
.src li{break-inside:avoid}

/* Leaflet: flat, on-palette */
.leaflet-container{font-family:inherit;background:#E7E1D7}
.leaflet-bar{border:1.5px solid var(--ink)!important;border-radius:10px!important;overflow:hidden}
.leaflet-bar a,.leaflet-bar a:hover{width:40px!important;height:40px!important;line-height:38px!important;background:var(--paper-2);color:var(--ink);font-size:20px!important;border-bottom-color:var(--rule)}
.leaflet-bar a.leaflet-disabled{background:var(--paper-2);color:var(--ink-2);cursor:default}
.leaflet-control-attribution{font-size:13px!important;background:rgba(251,248,243,.9)!important;color:var(--ink-2)}
.leaflet-control-attribution a{color:var(--ink)}
.leaflet-tooltip{background:var(--paper-2);color:var(--ink);border:1px solid var(--ink);border-radius:8px;font:500 13px/1.3 "Bricolage Grotesque",sans-serif;padding:3px 8px}
.leaflet-tooltip:before{display:none}
.pw{position:relative;width:16px;height:16px}
.pw i{position:absolute;inset:0;border-radius:50%;border:2px solid var(--paper-2);outline:1px solid rgba(32,30,31,.5)}
.pw.sub{width:10px;height:10px}.pw.sub i{border-width:1.5px}
.pw.sel i{transform:scale(1.6);outline:2px solid var(--ink)}
.lab{position:absolute;left:calc(100% + 6px);top:50%;transform:translateY(-50%);white-space:nowrap;font:600 13px/1.25 "Bricolage Grotesque",-apple-system,"PingFang HK","Noto Sans TC",sans-serif;color:var(--ink);background:var(--paper-2);padding:2px 8px;border-radius:var(--r-pill);border:0!important;pointer-events:none}
.pw.sub .lab{font-weight:500;padding:1px 7px}
.lab.hide{visibility:hidden}#map.zlo .pw.sub .lab{display:none}
.pw:hover .lab{display:block!important;visibility:visible!important;z-index:9}
.pw.sel .lab{display:block!important;visibility:visible!important;background:var(--ink);color:var(--paper)}

/* ---------- Bean Type ---------- */
.bt-top{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:var(--s-4);align-items:stretch}
.mtncol{display:flex;flex-direction:column;min-width:0}
#mtn{position:relative;flex:1 1 auto;min-height:380px;margin-top:var(--s-2)}
#mtn svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.mtncol .small{margin:12px 0 0}
.band{cursor:pointer}.band:hover .bfill{opacity:.85}
.spm{cursor:pointer}
.binfo{background:var(--c-bean);color:var(--on-forest);padding:32px;display:flex;flex-direction:column;min-width:0}
.binfo .ct{color:var(--on-forest);display:flex;align-items:center;flex-wrap:wrap;gap:6px}
.binfo .ct .tag{margin-left:2px}
.binfo h3{margin:20px 0 4px;font-size:28px;line-height:1.1;font-weight:700;letter-spacing:-.01em}
.binfo .rng{font-size:40px;line-height:1.1;font-weight:300;letter-spacing:-.02em}
.binfo .kvs{margin-top:var(--s-3)}
.binfo .kv{grid-template-columns:130px minmax(0,1fr);border-bottom-color:rgba(244,239,232,.28)}
.binfo .kv>span:first-child{color:var(--on-forest)}
.binfo .tag.r{border-color:var(--on-forest);color:var(--on-forest)}
.binfo .flv{margin-top:var(--s-3);background:var(--paper);color:var(--ink);padding:16px 18px;font-size:16px;line-height:1.5}
.binfo .flv b{display:block}
.binfo .flv .tag.r{border-color:var(--ink);color:var(--ink)}
.binfo .foot{color:var(--on-forest)}
.binfo .temp{margin-top:var(--s-3);font-size:16px;line-height:1.5}
.binfo .typ{margin-top:auto;padding-top:var(--s-3);font-size:14px;line-height:1.45}
.kv{display:grid;grid-template-columns:160px minmax(0,1fr);gap:var(--s-2) var(--s-3);padding:12px 0;border-bottom:1px solid var(--rule);font-size:16px;line-height:1.5}
.kv>span:first-child{color:var(--ink-2)}
.treesec{margin-top:var(--s-5)}
.treehd{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 24px}
.spl{display:flex;flex-wrap:wrap;gap:8px}
.treeph{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1.2fr);grid-template-areas:"main side labs" "cred cred cred";gap:var(--s-3);margin-top:var(--s-3);align-items:stretch}
.treeph .main{grid-area:main;width:100%;height:100%;min-height:320px;max-height:420px;object-fit:cover;border-radius:var(--r-media);display:block;background:var(--rule);filter:saturate(.92) contrast(1.03)}
.treeph .pair{grid-area:side;display:flex;flex-direction:column;gap:12px;min-width:0}
.treeph .pair img{width:100%;height:auto;flex:1 1 auto;min-height:160px;max-height:240px;object-fit:cover;border-radius:var(--r-media);display:block;background:var(--rule);filter:saturate(.92) contrast(1.03)}
.treeph .ctx{background:var(--c-pink);color:var(--on-pink);padding:16px 18px;font-size:16px;line-height:1.45}
.treeph .ctx b{display:block;margin-bottom:4px}
.treeph .ctx p{margin:0}
.treeph .labs{grid-area:labs;align-self:center;min-width:0}
.treeph .labs>div{display:grid;grid-template-columns:110px minmax(0,1fr);gap:var(--s-2);padding:11px 0;border-bottom:1px solid var(--rule);font-size:16px;line-height:1.45}
.treeph .labs>div>span:first-child{color:var(--ink-2)}
.treeph .cred{grid-area:cred;margin-top:0}
#species .item{display:flex;gap:16px;align-items:center;padding:16px;border-bottom:1px solid var(--rule)}
#species .item .dot{display:block;width:36px;height:36px;border-radius:50%;flex:none}
#species .item b{font-size:20px}
#species .item small{font-size:15px}
#species .item.sel{background:var(--paper-2)}
#species .item.sel .dot{outline:2px solid var(--ink);outline-offset:3px}
#treeFacts h3{margin:12px 0 6px;font-size:20px;line-height:1.2;font-weight:700}
.tblwrap{margin-top:8px;overflow-x:auto}
#cmp{width:100%;border-collapse:collapse;font-size:16px;line-height:1.45}
#cmp th,#cmp td{text-align:left;padding:14px 16px 14px 0;border-bottom:1px solid var(--rule);vertical-align:top}
#cmp th{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);border-bottom:1.5px solid var(--ink)}
#cmp td:first-child{font-weight:700}
#cmp th:nth-child(2),#cmp td:nth-child(2),#cmp th:nth-child(4),#cmp td:nth-child(4){text-align:right;font-variant-numeric:tabular-nums;padding-right:32px}
#cmp tr.sel td{background:var(--paper-2)}
.vgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:var(--s-4) var(--s-4);margin-top:var(--s-3)}
.vcard{border-top:1px solid var(--rule);padding-top:var(--s-2);min-width:0}
.vcard .bean{position:relative;height:132px;background:var(--paper-2);border-radius:var(--r-media);display:flex;align-items:center;justify-content:center;margin-bottom:var(--s-2)}
.vcard .bean svg{width:160px;height:120px}
.vcard .bean em{position:absolute;right:10px;bottom:8px;font-style:normal;font-size:13px;color:var(--ink-2)}
.vcard h4{display:inline-block;margin:0 0 12px;font-size:20px;line-height:1.2;font-weight:700;letter-spacing:-.01em;border-bottom:2px solid transparent;transition:border-color .2s}
.vcard:hover h4{border-bottom-color:var(--c-bean)}
.vcard p{margin:0 0 12px;font-size:16px;line-height:1.5}
.vcard p .lbl{display:block;margin-bottom:2px}
.vcard p.sub{font-size:14px;line-height:1.45;color:var(--ink-2)}

/* ---------- Process ---------- */
.jump{display:flex;flex-wrap:wrap;gap:8px;flex:0 1 480px}
.jump .pill{height:44px;font-size:15px}
.pm{display:flex;flex-wrap:wrap;gap:var(--s-4) var(--s-5);align-items:center;padding:var(--s-5) 0;border-top:1.5px solid var(--ink)}
.pm:nth-child(even){flex-direction:row-reverse}
.pmphoto{flex:5 1 380px;min-width:0;margin:0}
.pmphoto img,.pmphoto .diag{width:100%;height:auto;aspect-ratio:4/3;object-fit:cover;border-radius:var(--r-media);display:block;background:var(--rule);filter:saturate(.92) contrast(1.03)}
.pmphoto .diag{display:flex;align-items:center;justify-content:center;filter:none}
.pmphoto .diag svg{width:78%;height:auto;font-family:inherit}
.pmbody{flex:7 1 480px;min-width:0}
.pmbody h4{margin:0;font-size:28px;line-height:1.15;font-weight:700;letter-spacing:-.01em}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:10px 8px;margin:var(--s-3) 0}
.stp{display:inline-flex;align-items:center;gap:8px;max-width:100%}
.st{display:inline-flex;align-items:center;gap:10px;min-width:0;background:var(--paper-2);border:1px solid var(--rule);border-radius:22px;padding:6px 16px 6px 6px;font-size:15px;line-height:1.3}
.st b{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;flex:none;font-size:14px;font-weight:700;color:var(--ink)}
.arr{color:var(--ink-2);font-size:16px;flex:none}
.pmbody p{margin:0;font-size:18px;line-height:1.5}
.pmbody p.foot{margin-top:12px;font-size:15px;line-height:1.5}
.combo{display:flex;flex-wrap:wrap;gap:var(--s-4);align-items:stretch;margin-top:0}
#p_combo{flex:1 1 520px;margin:0;display:flex;gap:20px;align-items:flex-start;background:var(--c-pink);color:var(--on-pink);padding:32px 40px;font-size:18px;line-height:1.45}
#p_combo p{margin:0}
.combo .photo{flex:0 1 380px}
.qc{margin-top:var(--s-6)}
.qcgrid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:var(--s-4) var(--s-5);align-items:start;margin-top:var(--s-2)}
.moist{position:relative;margin:48px 0 8px}
.moist .mbar{position:relative;height:16px;border-radius:var(--r-pill);background:var(--rule);overflow:hidden}
.moist .opt{position:absolute;top:0;bottom:0;background:var(--c-bean)}
.moist .risk{position:absolute;top:0;bottom:0;right:0;background:repeating-linear-gradient(135deg,rgba(32,30,31,.32) 0 4px,transparent 4px 10px)}
.moist .mlab{position:absolute;top:-30px;font-size:15px;font-weight:700;white-space:nowrap}
.moist .ticks{position:relative;height:24px;margin-top:8px;font-size:14px;font-variant-numeric:tabular-nums}
.moist .ticks span{position:absolute;transform:translateX(-50%)}
.moist .ticks span:first-child{transform:none}.moist .ticks span:last-child{transform:translateX(-100%)}
.qckv .kv{display:block;padding:14px 0}
.qckv .kv>span:first-child{display:block;margin-bottom:6px;font-size:20px;font-weight:700;color:var(--ink)}
.qcgrid .photo{margin-top:var(--s-4)}

/* ---------- Grading ---------- */
.cupsec{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:var(--s-4) var(--s-5);align-items:start}
.cupsec.nophoto{grid-template-columns:minmax(0,1fr)}
.steps{list-style:none;margin:12px 0 0;padding:0}
.steps li{display:flex;gap:20px;align-items:baseline;padding:12px 0;border-bottom:1px solid var(--rule);font-size:16px;line-height:1.5}
.steps .num{width:44px;flex:none;font-size:40px;line-height:1;font-weight:300;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.cupsec .photo{position:sticky;top:calc(var(--hd) + 16px)}
.calcgrid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:var(--s-4) var(--s-5);align-items:start;margin-top:var(--s-6)}
.sl,.cups{display:grid;grid-template-columns:170px minmax(0,1fr) 60px;gap:var(--s-2) 20px;align-items:center;padding:12px 0;border-bottom:1px solid var(--rule);font-size:16px;line-height:1.35}
.sl output,.cups output{text-align:right;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.cupset{display:flex;flex-wrap:wrap;gap:6px 18px}
.cupset label{display:inline-flex;align-items:center;gap:8px;min-height:44px;font-size:15px;cursor:pointer}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:44px;background:transparent;margin:0;cursor:pointer;--p:50%}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:var(--r-pill);background:linear-gradient(var(--ink),var(--ink)) 0/var(--p) 100% no-repeat,var(--rule)}
input[type=range]::-moz-range-track{height:8px;border-radius:var(--r-pill);background:var(--rule)}
input[type=range]::-moz-range-progress{height:8px;border-radius:var(--r-pill);background:var(--ink)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;margin-top:-7px;border-radius:50%;background:var(--c-grading);border:2px solid var(--ink)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--c-grading);border:2px solid var(--ink)}
input[type=checkbox]{-webkit-appearance:none;appearance:none;width:22px;height:22px;margin:0;border:1.5px solid var(--ink);border-radius:5px;background:var(--paper-2);display:inline-grid;place-items:center;cursor:pointer;flex:none}
input[type=checkbox]::after{content:"";width:6px;height:11px;border:solid var(--ink);border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg);opacity:0}
input[type=checkbox]:checked{background:var(--c-grading)}
input[type=checkbox]:checked::after{opacity:1}
.cups select{height:44px;width:120px;padding:0 14px;border-radius:var(--r-pill);border:1.5px solid var(--ink);background:var(--paper-2);font:inherit;font-size:16px;color:var(--ink)}
.total{display:flex;flex-wrap:wrap;align-items:center;gap:16px 28px;margin-top:28px;padding:28px 32px;background:var(--c-grading);color:var(--on-blue)}
.total .num{font-size:72px;line-height:1;font-weight:300;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.badge{display:inline-flex;align-items:center;padding:10px 20px;border-radius:var(--r-pill);background:var(--ink);color:var(--paper);font-size:18px;font-weight:700;line-height:1.2}
.tiers{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.tiers span{display:inline-flex;align-items:center;min-height:40px;padding:0 18px;border-radius:var(--r-pill);border:1.5px solid var(--ink);font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.tiers span.on{background:var(--ink);color:var(--paper)}
#calc .foot{margin-top:14px}
#attrs .kv{grid-template-columns:170px minmax(0,1fr)}
#attrs .kv>span:first-child{color:var(--ink);font-weight:700}
#attrs .tip{font-size:18px;align-items:center;flex-wrap:wrap}

/* ---------- Mobile ---------- */
@media (max-width:1100px){
  .vgrid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
  .treeph{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"main side" "labs labs" "cred cred"}
}
@media (max-width:1000px){
  .origin-grid,.bt-top,.calcgrid,.cupsec,.qcgrid{grid-template-columns:minmax(0,1fr)}
  .origins{position:static;max-height:none}
  #regions{max-height:520px}
  .cupsec .photo{position:static}
}
@media (max-width:760px){
  :root{--gutter:16px;--hd:auto}
  html{scroll-padding-top:150px}
  .hd{gap:10px 12px;padding-top:10px;padding-bottom:6px}
  .brand{order:1;flex:1 1 0}
